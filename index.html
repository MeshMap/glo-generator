<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>AR Draw Prompt Generator</title>
  <meta name="description" content="Random drawing prompt generator with a get-ready countdown and timer." />
  <meta name="theme-color" content="#faf9f5" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#1c1c1a" media="(prefers-color-scheme: dark)" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="favicon-32.png" sizes="32x32" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Draw Prompt" />
  <link rel="stylesheet" href="src/styles.css" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.11.0/dist/tabler-icons.min.css" />
</head>
<body>
  <main class="app">
    <img class="logo" src="src/logo.png" alt="GLO Graffiti" width="900" height="465" />
    <h1 class="sr-only">Random drawing prompt generator</h1>

    <p class="label">Type</p>
    <div class="row" id="difficulty-row">
      <button class="diff diff-item active" data-diff="item"><i class="ti ti-circle-filled dot"></i>Item</button>
      <button class="diff diff-tag" data-diff="tag"><i class="ti ti-circle-filled dot"></i>Tag</button>
      <button class="diff diff-mural" data-diff="mural"><i class="ti ti-circle-filled dot"></i>Mural</button>
      <button class="diff diff-events" data-diff="events"><i class="ti ti-circle-filled dot"></i>Events</button>
    </div>

    <div class="timer-select">
      <p class="label">Timer</p>
      <span class="timer-value" id="timer-value">30s</span>
    </div>
    <input type="range" class="timer-slider" id="timer-slider" min="0" max="120" step="5" value="30" aria-label="Timer duration" />

    <div class="card" id="card">
      <div class="badge" id="badge"><i class="ti ti-circle-filled"></i><span id="badge-text">Item</span></div>
      <div class="context" id="context"></div>
      <div class="prompt" id="prompt">Tap generate</div>
      <div class="ready" id="ready">Get ready…</div>
      <div class="timer" id="timer">0:30</div>
      <div class="done" id="done">Time's up — spray cans down!</div>
    </div>

    <div class="row controls">
      <button id="go" class="btn-primary"><i class="ti ti-refresh"></i>Generate</button>
      <button id="restart" class="btn" title="Restart timer with same prompt"><i class="ti ti-rotate"></i>Restart</button>
      <button id="stop" class="btn hidden"><i class="ti ti-player-pause"></i>Pause</button>
    </div>
  </main>

  <script src="src/prompts.js"></script>
  <script src="src/holidays.js"></script>
  <script src="src/app.js"></script>
</body>
</html>
